<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="">
      <!-- Navbar here -->
      <nav class="container navbar navbar-expand-lg" style="height: 75px">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img
              src="https://www.freepnglogos.com/uploads/starbucks-coffee-green-logo-28.png"
              alt=""
              width="40px"
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <!-- Nav links here -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-4">
              <li class="nav-item">
                <a
                  class="nav-link text-success active text-decoration-underline"
                  href="#"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Gift</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Order</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Pay</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Store</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Corporate Gifting</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Looking for something else?"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>

      <!-- Green Divider Here -->
      <div
        class="card"
        style="background-color: #1e3932 !important; height: 75px"
      >
        <div class="card-body container">
          <div class="row align-items-center">
            <div class="col-8"></div>
            <div class="col-4 text-end">
              <button
                class="btn btn-transparent rounded-pill btn-outline-light"
              >
                Know More
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Carousel -->
      <div class="container-fluid mt-5">
        <div class="container-sm">
          <div class="row align-items-center">
            <div id="carouselExampleIndicators" class="carousel slide">
              <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
              </div>
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="https://preprodtsbstorage.blob.core.windows.net/cms/uploads/BG_WEB_08b7ce409f.png" class="d-block w-100 z-n1" alt="...">
                </div>
                <div class="carousel-item">
                  <img src="..." class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                  <img src="..." class="d-block w-100" alt="...">
                </div>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="container p-5">
        <div class="row">
          <div class="col-12">
            <h2>Handcrafted Curations:</h2>
          </div>
        </div>

        <!-- Handpicked Section -->

        <div class="row">
          <div class="col-12 d-flex align-items-center justify-content-between flex-wrap">
            <div class="col-2">
              <div class="card border-0" style="width: 18rem;">
                <div class="p-3 text-center">
                  <img src="https://www.starbucks.in/assets/icon/Bestseller.webp" class="rounded-circle mx-auto d-block" style="max-width: 150px; height: 100px; object-fit: cover;" alt="Profile">
                </div>
                <div class="card-body">
                  <p class="card-text text-center">Bestseller</p>
                </div>
              </div>              
            </div>

            <div class="col-2">
              <div class="card border-0" style="width: 18rem;">
                <div class="p-3 text-center">
                  <img src="https://www.starbucks.in/assets/icon/Drinks.webp" class="rounded-circle mx-auto d-block" style="max-width: 150px; height: 100px; object-fit: cover;" alt="Profile">
                </div>
                <div class="card-body">
                  <p class="card-text text-center">Drinks</p>
                </div>
              </div>              
            </div>

            <div class="col-2">
              <div class="card border-0" style="width: 18rem;">
                <div class="p-3 text-center">
                  <img src="https://www.starbucks.in/assets/icon/Food.webp" class="rounded-circle mx-auto d-block" style="max-width: 150px; height: 100px; object-fit: cover;" alt="Profile">
                </div>
                <div class="card-body">
                  <p class="card-text text-center">Food</p>
                </div>
              </div>              
            </div>

            <div class="col-2">
              <div class="card border-0" style="width: 18rem;">
                <div class="p-3 text-center">
                  <img src="https://www.starbucks.in/assets/icon/Merchandise.webp" class="rounded-circle mx-auto d-block" style="max-width: 150px; height: 100px; object-fit: cover;" alt="Profile">
                </div>
                <div class="card-body">
                  <p class="card-text text-center">Merchandise</p>
                </div>
              </div>              
            </div>

            <div class="col-2">
              <div class="card border-0" style="width: 18rem;">
                <div class="p-3 text-center">
                  <img src="https://starbucksstatic.cognizantorderserv.com/Category/Small/webP/CoffeeAtHome.webp" class="rounded-circle mx-auto d-block" style="max-width: 150px; height: 100px; object-fit: cover;" alt="Profile">
                </div>
                <div class="card-body">
                  <p class="card-text text-center">Coffee at home</p>
                </div>
              </div>              
            </div>

            <div class="col-2">
              <div class="card border-0" style="width: 18rem;">
                <div class="p-3 text-center">
                  <img src="https://www.starbucks.in/assets/icon/Bestseller.webp" class="rounded-circle mx-auto d-block" style="max-width: 150px; height: 100px; object-fit: cover;" alt="Profile">
                </div>
                <div class="card-body">
                  <p class="card-text text-center">Bestseller</p>
                </div>
              </div>              
            </div>

          </div>
        </div>
      </div>

      <!-- Barista Recommends Section -->
      <div class="container-fluid" style="background-color: #dbd2c3;">
        <div class="container p-4" style="height: 300px;">
          <div class="row">
            <div class="col-8">
              <h2>Barista Recommends</h2>
            </div>
            <div class="col-4 text-end">
              <a class="text-secondary" href="#">Explore more</a>
            </div>
          </div>

          <div class="row">
            <div class="col-4 mt-5">
              <div class="card border-0">
                <div class="card-horizontal d-flex align-items-center">
                  <img src="https://starbucksstatic.cognizantorderserv.com/Items/Small/webP/100501.webp" class="card-img-top ms-3" alt="..." 
                  style="height: 100px; width: 100px; object-fit: cover;"
                  >
                  <div class="fd-col p-3">
                    <img src="https://www.starbucks.in/assets/icon/veg.svg" alt="">
                    <h6>Java Chip Frappuccino</h6>
                    <p class="text-muted fw-lighter">
                      Tall (350 ml) | 250 cal
                    </p>
                  </div>
                </div>
                <div class="card-footer border-0 bg-transparent">
                  <div class="d-flex justify-content-between align-items-center">
                    <p>₹456.75</p>

                    <div class="right">
                      <button class="btn btn-success w-100">Add to Cart</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
